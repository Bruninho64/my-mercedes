<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f14"><link rel="manifest" href="manifest.json"><title>My Mercedes</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef1f4;font-family:Arial,sans-serif;color:#151a20}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:80px}header{background:linear-gradient(145deg,#070a0e,#202833);color:#fff;padding:20px 18px 25px;border-radius:0 0 28px 28px}.brand{font-weight:800;letter-spacing:1px}.hero{margin-top:25px}.hero h1{margin:4px 0;font-size:28px}.muted{color:#aeb6bf;font-size:12px}.km{font-size:25px;font-weight:800;color:#e7bd58;margin-top:10px}main{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:18px;padding:15px;margin-bottom:10px;box-shadow:0 4px 16px #0000000a}.label{font-size:10px;color:#7a838c;font-weight:800}.value{font-size:22px;font-weight:800;margin-top:9px}.small{font-size:12px;color:#727b84;margin-top:5px}h2{font-size:17px}.item{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #edf0f2}.ico{width:40px;height:40px;background:#f0f2f4;border-radius:12px;display:grid;place-items:center}.grow{flex:1}.title{font-weight:750;font-size:13px}.sub{font-size:11px;color:#7b838c;margin-top:4px}.button{border:0;border-radius:14px;padding:14px;width:100%;font-weight:800;background:#0d1218;color:#fff}.gold{background:#d8a93a;color:#111}.input{width:100%;padding:12px;border:1px solid #d8dde2;border-radius:12px;margin:5px 0 10px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:70px;background:#fff;border-top:1px solid #ddd;display:flex}.bottom button{flex:1;border:0;background:#fff;font-size:10px}.bottom b{display:block;font-size:19px}.screen{display:none}.active{display:block}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:end}.modal.show{display:flex}.sheet{background:#fff;width:min(520px,100%);margin:auto;padding:20px;border-radius:24px 24px 0 0}</style></head>
<body><div class="app"><header><div class="brand">★ MY MERCEDES</div><div class="hero"><div class="muted">MON VÉHICULE</div><h1>CLS 320 CDI</h1><div class="muted">W219 • 2006 • OM642 V6 • AUTOMATIQUE</div><div class="km" id="km">306 000 KM</div></div></header><main>
<section id="home" class="screen active"><h2>Vue d'ensemble</h2><div class="grid"><div class="card"><div class="label">PROCHAINE RÉVISION</div><div class="value">15 000 km</div><div class="small">Vidange + filtre à huile</div></div><div class="card"><div class="label">DÉPENSES</div><div class="value" id="total">0 €</div><div class="small">enregistrées</div></div></div><div class="card"><h2>À surveiller</h2><div id="watch"></div></div><button class="button gold" onclick="openM()">＋ Ajouter une facture / dépense</button></section>
<section id="service" class="screen"><h2>Entretien de ma CLS</h2><div class="card" id="services"></div></section>
<section id="history" class="screen"><h2>Historique</h2><div class="card" id="history"></div></section>
<section id="car" class="screen"><h2>Ma Mercedes</h2><div class="card"><div class="label">KILOMÉTRAGE</div><input class="input" id="editkm" type="number"><div class="label">VIN</div><input class="input" id="vin" placeholder="Optionnel"><button class="button" onclick="saveCar()">Enregistrer</button></div></section></main>
<nav class="bottom"><button onclick="show('home')"><b>⌂</b>Accueil</button><button onclick="show('service')"><b>⚙</b>Entretien</button><button onclick="show('history')"><b>▤</b>Historique</button><button onclick="show('car')"><b>♢</b>Véhicule</button></nav></div>
<div class="modal" id="modal"><div class="sheet"><h2>Ajouter une dépense</h2><input class="input" id="desc" placeholder="Ex. Huile + filtre"><input class="input" id="cost" type="number" step=".01" placeholder="Montant €"><input class="input" id="date" type="date"><input class="input" id="ekm" type="number"><button class="button gold" onclick="add()">Enregistrer</button><br><br><button class="button" onclick="closeM()">Annuler</button></div></div>
<script>const K='myMercedesFinal';let d=JSON.parse(localStorage.getItem(K)||'{"km":306000,"total":0,"events":[]}');const plan=[['🛢️','Vidange moteur + filtre','15 000 km / 12 mois'],['🌬️','Filtre à air','30 000 km / 24 mois'],['⛽','Filtre à gazole','30 000 km / 24 mois'],['⚙️','Vidange BVA + filtre','60 000 km'],['🛑','Liquide de frein','24 mois'],['💧','Liquide de refroidissement','Contrôle'],['♻️','EGR / admission','Contrôle'],['🔍','FAP / DPF','Diagnostic'],['🔋','Batterie 12 V','Contrôle'],['🔥','Bougies de préchauffage','Selon défauts']];function save(){localStorage.setItem(K,JSON.stringify(d))}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');render()}function openM(){modal.classList.add('show');date.value=new Date().toISOString().slice(0,10);ekm.value=d.km}function closeM(){modal.classList.remove('show')}function add(){if(!desc.value.trim())return;let c=Number(cost.value||0);d.total+=c;d.km=Math.max(d.km,Number(ekm.value||d.km));d.events.unshift({name:desc.value.trim(),c,date:date.value,km:d.km});save();closeM();render()}function saveCar(){d.km=Number(editkm.value||d.km);save();render();alert('Véhicule enregistré')}function render(){km.textContent=d.km.toLocaleString('fr-FR')+' KM';total.textContent=d.total.toLocaleString('fr-FR',{minimumFractionDigits:2})+' €';watch.innerHTML=plan.slice(0,5).map(x=>`<div class="item"><div class="ico">${x[0]}</div><div class="grow"><div class="title">${x[1]}</div><div class="sub">${x[2]}</div></div></div>`).join('');services.innerHTML=plan.map(x=>`<div class="item"><div class="ico">${x[0]}</div><div class="grow"><div class="title">${x[1]}</div><div class="sub">${x[2]}</div></div></div>`).join('');history.innerHTML=d.events.length?d.events.map(x=>`<div class="item"><div class="ico">🔧</div><div><div class="title">${x.name}</div><div class="sub">${x.date} • ${x.km.toLocaleString('fr-FR')} km • ${x.c.toLocaleString('fr-FR')} €</div></div></div>`).join(''):'<div class="small">Aucune dépense enregistrée.</div>';editkm.value=d.km}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
